name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run Python regressions
        run: python -B -m unittest discover -s tests -v
      - name: Run JavaScript API tests
        run: node --test tests/test_dashboard_client.mjs
      - name: Build the x64 relay
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          call relay\build.bat
      - name: Upload the verified build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: overwatch-1.74-relay-x64
          path: relay/owwfd_relay.dll
          if-no-files-found: error
          retention-days: 14
