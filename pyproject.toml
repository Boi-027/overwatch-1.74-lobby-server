# Tool settings. The Python packages are pinned in requirements.txt (START.bat installs them).

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ow174"]

[tool.pytest.ini_options]
testpaths = ["tests"]
